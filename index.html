<style>
:root{
  --paper:#E9EDF2; --card:#FFFFFF; --card-2:#F4F7FA; --card-3:#FBFCFD;
  --ink:#141A23; --ink-2:#57616F; --ink-3:#8C97A5;
  --line:#CFD7E1; --line-2:#E3E9F0;
  --gul:#F2C230; --gul-deep:#C8971A; --gul-ink:#43330A;
  --bla:#2C5F8A;
  --agree:#2C6B54; --disagree:#A8412E;
  --focus:#2B5FA8;
  --sh-1:0 1px 2px rgba(20,26,35,.05);
  --sh-2:0 1px 2px rgba(20,26,35,.06), 0 10px 30px -8px rgba(20,26,35,.14);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0F1319; --card:#181E26; --card-2:#1F262F; --card-3:#232B35;
    --ink:#E8EDF4; --ink-2:#98A4B3; --ink-3:#6D798A;
    --line:#2B333E; --line-2:#222932;
    --gul:#F2C230; --gul-deep:#F2C230; --gul-ink:#2B2106;
    --bla:#6FA5D6;
    --agree:#5FBF9B; --disagree:#E8846C;
    --focus:#7FB0F0;
    --sh-1:0 1px 2px rgba(0,0,0,.4);
    --sh-2:0 1px 2px rgba(0,0,0,.45), 0 12px 34px -10px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --paper:#0F1319; --card:#181E26; --card-2:#1F262F; --card-3:#232B35;
  --ink:#E8EDF4; --ink-2:#98A4B3; --ink-3:#6D798A;
  --line:#2B333E; --line-2:#222932;
  --gul:#F2C230; --gul-deep:#F2C230; --gul-ink:#2B2106;
  --bla:#6FA5D6;
  --agree:#5FBF9B; --disagree:#E8846C;
  --focus:#7FB0F0;
  --sh-1:0 1px 2px rgba(0,0,0,.4);
  --sh-2:0 1px 2px rgba(0,0,0,.45), 0 12px 34px -10px rgba(0,0,0,.6);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Source Serif 4",Georgia,"Times New Roman",serif;
  font-size:17px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;text-wrap:balance;letter-spacing:-.02em;margin:0}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none;padding:0}
:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px;border-radius:3px}
.wrap{max-width:780px;margin:0 auto;padding:0 22px 110px}

/* ============ ballot head ============ */
.masthead{background:var(--card);border-bottom:1px solid var(--line);position:relative}
.masthead::after{
  content:"";position:absolute;left:0;right:0;bottom:-9px;height:9px;
  background:var(--card);
  -webkit-mask:radial-gradient(circle 5px at 9px 0,transparent 98%,#000) repeat-x 0 0/18px 9px;
  mask:radial-gradient(circle 5px at 9px 0,transparent 98%,#000) repeat-x 0 0/18px 9px;
}
.mh{max-width:780px;margin:0 auto;padding:24px 22px 26px;display:flex;flex-direction:column;gap:16px}
.mh-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.slug{display:flex;align-items:center;gap:11px;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-2)}
.swatch{width:30px;height:14px;background:var(--gul);border:1px solid rgba(0,0,0,.22);border-radius:1.5px;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.07)}
h1{font-size:clamp(32px,6.6vw,50px);font-weight:800;line-height:.98}
h1 .thin{display:block;font-weight:500;color:var(--ink-2);font-size:.52em;letter-spacing:-.01em;margin-top:.32em}
.lede{margin:0;color:var(--ink-2);font-size:17px;max-width:60ch}

/* language switch */
.lang{display:flex;gap:0;border:1px solid var(--line);border-radius:99px;overflow:hidden;flex:none;background:var(--card-2)}
.lang button{display:flex;align-items:center;gap:7px;padding:7px 13px;font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.08em;color:var(--ink-3);transition:background .14s,color .14s}
.lang button+button{border-left:1px solid var(--line)}
.lang button:hover{color:var(--ink)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.lang .fl{font-size:15px;line-height:1;filter:saturate(1.05)}

/* tally strip */
.tally{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--line-2)}
.tally div{flex:1 1 130px;background:var(--card-2);padding:11px 14px;display:flex;flex-direction:column;gap:2px}
.tally b{font-family:"IBM Plex Mono",monospace;font-size:20px;font-weight:600;letter-spacing:-.02em}
.tally span{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);line-height:1.35}
.tally div:nth-child(1) b{color:var(--ink)}
.tally div:nth-child(2) b{color:var(--agree)}
.tally div:nth-child(3) b{color:var(--ink-3)}

/* ============ progress ============ */
.prog{position:sticky;top:0;z-index:8;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(9px);border-bottom:1px solid var(--line-2)}
.prog .in{max-width:780px;margin:0 auto;padding:11px 22px;display:flex;align-items:center;gap:15px}
.ticks{flex:1;display:flex;gap:2px;height:8px}
.tick{flex:1;background:var(--line);border-radius:1px;transition:background .2s}
.tick.done{background:var(--gul)}
.tick.now{background:var(--ink)}
.pc{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-2);white-space:nowrap;letter-spacing:.04em}

/* ============ question ============ */
.card{background:var(--card);border:1px solid var(--line);border-radius:5px;box-shadow:var(--sh-2);padding:0;margin-top:28px;overflow:hidden}
.card-hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 24px;border-bottom:1px solid var(--line-2);background:var(--card-3)}
.area{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gul-ink);background:var(--gul);padding:3px 9px;border-radius:2px;font-weight:600}
.qno{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3);letter-spacing:.06em}
.card-bd{padding:26px 24px 22px}
.qtext{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:clamp(22px,3.9vw,29px);line-height:1.2;margin:0 0 24px;text-wrap:balance}
.scale{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card-2);border:1px solid var(--line-2);border-radius:3px;padding:13px 15px;transition:border-color .13s,background .13s,transform .13s,box-shadow .13s;position:relative}
.opt:hover{border-color:var(--ink-3);transform:translateX(3px);box-shadow:var(--sh-1)}
.opt .kbd{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3);border:1px solid var(--line);border-radius:2px;width:21px;height:21px;display:grid;place-items:center;flex:none}
.opt .box{width:15px;height:15px;border:1.5px solid currentColor;border-radius:2px;flex:none;display:grid;place-items:center;position:relative}
.opt .box::after{content:"";width:9px;height:9px;background:currentColor;border-radius:1px;transform:scale(0);transition:transform .13s cubic-bezier(.3,1.5,.5,1)}
.opt[aria-pressed="true"] .box::after{transform:scale(1)}
.opt .lbl{flex:1}
.o-2,.o-1{color:var(--disagree)} .o0{color:var(--ink-3)} .o1,.o2{color:var(--agree)}
.o-1,.o1{opacity:.88}
.opt[aria-pressed="true"]{background:var(--gul);border-color:var(--gul-deep);color:var(--gul-ink);opacity:1}
.opt[aria-pressed="true"] .kbd{border-color:rgba(0,0,0,.28);color:inherit}

.weight{display:flex;align-items:center;gap:11px;margin-top:22px;padding-top:17px;border-top:1px dashed var(--line);flex-wrap:wrap}
.weight>span{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
.chip{border:1px solid var(--line);border-radius:99px;padding:5px 13px;font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-2);transition:all .13s}
.chip:hover{border-color:var(--ink-3)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.nav{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:15px 24px;border-top:1px solid var(--line-2);background:var(--card-3)}
.btn{border:1px solid var(--line);border-radius:3px;padding:9px 17px;font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:14.5px;transition:all .13s}
.btn:hover{border-color:var(--ink-2)}
.btn.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.pri:hover{opacity:.87}
.btn[disabled]{opacity:.32;cursor:not-allowed}
.xbtn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;background:var(--ink);color:var(--paper);border-color:var(--ink)}
.xbtn:hover{opacity:.87;border-color:var(--ink)}
.xbtn svg{width:14px;height:14px;flex:none}
.hint{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);text-align:center;margin:15px 0 0;letter-spacing:.03em}
.hint kbd{border:1px solid var(--line);border-radius:2px;padding:1px 4px;font-family:inherit}

/* ============ compass plot ============ */
.plotwrap{background:var(--card);border:1px solid var(--line);border-radius:5px;box-shadow:var(--sh-2);margin-top:22px;overflow:hidden}
.plot-hd{padding:13px 20px;border-bottom:1px solid var(--line-2);background:var(--card-3);font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.plot{position:relative;aspect-ratio:1/1;margin:20px;background:
  linear-gradient(var(--line-2) 1px,transparent 1px) 0 0/100% 25%,
  linear-gradient(90deg,var(--line-2) 1px,transparent 1px) 0 0/25% 100%;
  border:1px solid var(--line)}
.plot .ax{position:absolute;background:var(--line);z-index:1}
.plot .ax.h{left:0;right:0;top:50%;height:1.5px}
.plot .ax.v{top:0;bottom:0;left:50%;width:1.5px}
.plot .axlbl{position:absolute;font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);z-index:2}
.axlbl.n{top:6px;left:50%;transform:translateX(-50%)}
.axlbl.s{bottom:6px;left:50%;transform:translateX(-50%)}
.axlbl.w{left:6px;top:50%;transform:translateY(-50%) rotate(-90deg);transform-origin:left center}
.axlbl.e{right:6px;top:50%;transform:translateY(-50%) rotate(90deg);transform-origin:right center}
.dot{position:absolute;width:9px;height:9px;border-radius:99px;transform:translate(-50%,-50%);z-index:3;border:1.5px solid var(--card)}
.dot.big{width:17px;height:17px;background:var(--ink);border:3px solid var(--gul);z-index:5;box-shadow:0 0 0 3px color-mix(in srgb,var(--gul) 30%,transparent)}
.dot em{position:absolute;left:130%;top:50%;transform:translateY(-50%);font-style:normal;font-family:"IBM Plex Mono",monospace;font-size:9px;color:var(--ink-2);white-space:nowrap;letter-spacing:.03em}
.dot.flip em{left:auto;right:130%}
.dot.big em{font-family:"Bricolage Grotesque",sans-serif;font-size:11px;font-weight:700;color:var(--ink);letter-spacing:0}
.plot-ft{padding:0 20px 18px;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3);line-height:1.6}

/* ============ results ============ */
.res-hd{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:10px;margin:34px 0 0}
.res-hd h2{font-size:clamp(25px,4.8vw,34px);font-weight:800}
.res-hd .mono{font-size:11.5px;color:var(--ink-3);letter-spacing:.04em}
.taken{margin-top:7px;font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3);letter-spacing:.04em}
.taken[hidden]{display:none}
.rows{display:flex;flex-direction:column;gap:1px;margin-top:18px;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:var(--line-2);box-shadow:var(--sh-1)}
.row{background:var(--card);padding:12px 16px;display:grid;grid-template-columns:24px 1fr 100px 56px;gap:14px;align-items:center;transition:background .13s}
.row:hover{background:var(--card-2)}
.row.gold{background:linear-gradient(90deg,color-mix(in srgb,var(--gul) 16%,var(--card)),var(--card) 62%)}
.rk{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3);text-align:right}
.row.gold .rk{color:var(--gul-deep);font-weight:600}
.pname{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:15px;display:flex;align-items:center;gap:9px;min-width:0;letter-spacing:-.01em}
.pname i{width:4px;height:19px;border-radius:99px;flex:none}
.pname s{text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pname em{font-style:normal;font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--ink-3);border:1px solid var(--line);border-radius:2px;padding:1px 5px;flex:none}
.bar{height:8px;background:var(--line-2);border-radius:99px;overflow:hidden}
.bar span{display:block;height:100%;border-radius:99px;transition:width .5s cubic-bezier(.3,0,.2,1)}
.pct{font-family:"IBM Plex Mono",monospace;font-size:14.5px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.cov{grid-column:2/-1;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3);margin-top:4px;letter-spacing:.02em}
.warn{grid-column:2/-1;font-size:12.5px;color:var(--disagree);margin-top:5px;font-style:italic;line-height:1.4}
@media(max-width:600px){
  .row{grid-template-columns:20px 1fr 50px}
  .bar{grid-column:2/-1;order:3;margin-top:6px}
  .pct{order:2}
}

.note{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--gul);border-radius:3px;padding:17px 19px;margin-top:24px;font-size:15.5px;color:var(--ink-2)}
.note.blue{border-left-color:var(--bla)}
.note b{color:var(--ink)}
details{background:var(--card);border:1px solid var(--line);border-radius:5px;margin-top:20px}
summary{padding:15px 19px;font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:14.5px;cursor:pointer;letter-spacing:-.01em}
summary:hover{color:var(--bla)}
.plist{padding:2px 19px 19px;columns:2;column-gap:28px;font-size:13.5px;color:var(--ink-2)}
.plist div{break-inside:avoid;padding:2.5px 0}
@media(max-width:600px){.plist{columns:1}}
.foot{max-width:780px;margin:0 auto;padding:36px 22px 44px;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);line-height:1.75}
.foot a{color:var(--ink-2)}
.hide{display:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

/* ---------------- compass axes ---------------- */
const ECON = {3:1, 4:-1, 5:-1, 7:-1, 18:-1, 21:1};
const SOC  = {0:-1, 1:-1, 2:1, 12:1, 13:1, 14:-1, 23:1, 26:-1};
function axis(vec, map){
  let s=0, w=0;
  for(const k in map){ const p=vec[k]; if(p===0) continue; s+=p*map[k]; w+=2*Math.abs(map[k]); }
  return w ? {v:s/w, n:w/2} : null;
}

        <button class="chip" data-w="2" aria-pressed="${wt[i]===2}">${esc(t.wHigh)}</button>
      </div>
      <p class="hint">${t.hint}</p>
    </div>
    <div class="nav">
      <button class="btn" id="prev" ${i===0?"disabled":""}>${esc(t.prev)}</button>
      <button class="btn pri" id="next">${esc(i===Q.length-1?t.show:t.next)}</button>
    </div>
  </div>`;

  $("quiz").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    ans[i] = +b.dataset.v;
    if(i<Q.length-1){ i++; render(); } else finish();
  });
  $("quiz").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{ wt[i]=+b.dataset.w; render(); });
  const p=$("prev"); if(p) p.onclick=()=>{ if(i>0){ i--; render(); } };
  $("next").onclick=()=>{ if(i<Q.length-1){ i++; render(); } else finish(); };
  progress();
}

/* ---------------- completion counter ---------------- */
/* Set to the deployed Worker endpoint, e.g.
   "https://valkompass-counter.SUBDOMAIN.workers.dev/count".
   Left empty the counter is simply never shown and nothing is requested. */
const COUNTER_URL = "";
const MIN_SHOW = 50;          /* hide the number until it is worth showing */
const STORE_KEY = "vk_taken_v1";
let takenCount = null, posted = false;

function paintTaken(){
  const el = $("taken");
  if(!el || takenCount === null || takenCount < MIN_SHOW) return;
  const f = takenCount.toLocaleString(lang === "sv" ? "sv-SE" : "en-GB");
  el.textContent = T[lang].taken(f, takenCount);
  el.hidden = false;
}

async function bumpCounter(){
  if(!COUNTER_URL) return;
  let already = false;
  try{ already = localStorage.getItem(STORE_KEY) === "1"; }catch(e){}
  try{
    const r = await fetch(COUNTER_URL, { method: already ? "GET" : "POST" });
    if(!r.ok) return;
    const j = await r.json();
    if(!already){ try{ localStorage.setItem(STORE_KEY,"1"); }catch(e){} }
    if(typeof j.count === "number"){ takenCount = j.count; paintTaken(); }
  }catch(e){ /* decorative: never let the counter affect the results */ }
}

/* ---------------- share ---------------- */
function shareText(scored, t){
  const top = scored.slice(0,3).map((s,n)=>`${n+1}. ${s.name} ${s.pct}%`).join("\n");
  return `${t.shareLead}\n\n${top}\n\n${t.shareTag}`;
}

/* ---------------- results ---------------- */
function finish(){
  const t = T[lang];
  const answered = ans.map((a,k)=>[a,k]).filter(([a])=>a!==null);
  if(!answered.length){ alert(t.noAns); return; }
  onResults = true;

  const scored = P.map(([name,abbr,color,vec,flag])=>{
    let num=0, den=0, cov=0;
    for(const [a,k] of answered){
      const p=vec[k]; if(p===0) continue;
      num += wt[k]*(1-Math.abs(a-p)/4); den += wt[k]; cov++;
    }
    return { name, abbr, color, flag, cov,
      pct: Math.round(((num+M*0.5)/(den+M))*100),
      raw: Math.round((den? num/den : .5)*100) };
  }).sort((a,b)=> b.pct-a.pct || b.cov-a.cov);
  const max = scored[0].pct;

  /* compass */
  const uE = axis(ans.map(a=>a===null?0:a), ECON);
  const uS = axis(ans.map(a=>a===null?0:a), SOC);
  const px = v => 5 + (v+1)/2*90;   // inset so extremes don't sit on the frame
  const py = v => 5 + (1-v)/2*90;
  let plot = "";
  if(uE && uS && uE.n>=2 && uS.n>=2){
    const dots = P.map(([name,abbr,color,vec])=>{
      const e=axis(vec,ECON), s=axis(vec,SOC);
      if(!e||!s||e.n<3||s.n<3) return null;
      const L=px(e.v);
      return `<div class="dot${L>66?" flip":""}" style="left:${L}%;top:${py(s.v)}%;background:${color}" title="${esc(name)}"><em>${esc(abbr)}</em></div>`;
    }).filter(Boolean).join("");
    plot = `
    <div class="plotwrap">
      <div class="plot-hd">${esc(t.plotHd)}</div>
      <div class="plot">
        <div class="ax h"></div><div class="ax v"></div>
        <span class="axlbl n">${esc(t.axN)}</span>
        <span class="axlbl s">${esc(t.axS)}</span>
        <span class="axlbl w">${esc(t.axW)}</span>
        <span class="axlbl e">${esc(t.axE)}</span>
        ${dots}
        <div class="dot big${px(uE.v)>66?" flip":""}" style="left:${px(uE.v)}%;top:${py(uS.v)}%"><em>${esc(t.you)}</em></div>
      </div>
      <p class="plot-ft">${esc(t.plotFt)}</p>
    </div>`;
  }

  $("results").innerHTML = `
  <div class="res-hd">
    <h2>${esc(t.resTitle)}</h2>
    <span class="mono">${esc(t.resMeta(answered.length))}</span>
  </div>
  <div class="taken" id="taken" hidden></div>
  ${plot}
  <div class="rows">
    ${scored.map((s,n)=>`<div class="row${n===0?" gold":""}">
      <div class="rk mono">${n+1}</div>
      <div class="pname"><i style="background:${s.color}"></i><s>${esc(s.name)}</s><em>${esc(s.abbr)}</em></div>
      <div class="bar"><span style="width:${s.pct/max*100}%;background:${s.color}"></span></div>
      <div class="pct">${s.pct}%</div>
      <div class="cov mono">${esc(t.cov(s.cov, answered.length, s.raw))}</div>
      ${s.flag?`<div class="warn">${esc(t.nmr)}</div>`:""}
    </div>`).join("")}
  </div>

  <div class="note"><b>${esc(t.howHd)}</b> ${t.how(M)}</div>
  <div class="note blue"><b>${esc(t.gapHd(NOPLAT.length))}</b> ${esc(t.gap)}</div>

  <details>
    <summary>${esc(t.listSum(NOPLAT.length))}</summary>
    <div class="plist">${NOPLAT.map(n=>`<div>${esc(n)}</div>`).join("")}</div>
  </details>

  <div class="nav" style="margin-top:26px;border:1px solid var(--line);border-radius:5px">
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn" id="back">${esc(t.back)}</button>
      <button class="btn" id="again">${esc(t.again)}</button>
    </div>
    <a class="btn xbtn" id="xshare" target="_blank" rel="noopener"
       href="https://x.com/intent/post?text=${encodeURIComponent(shareText(scored,t))}">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M18.9 2H22l-6.8 7.8L23 22h-6.4l-5-6.6L5.8 22H2.7l7.3-8.3L1.5 2H8l4.7 6.2L18.9 2Zm-1.1 18h1.7L7.4 3.8H5.6L17.8 20Z"/></svg>
      ${esc(t.shareX)}
    </a>
  </div>`;

  $("quiz").classList.add("hide");
  $("results").classList.remove("hide");
  $("prog").classList.add("hide");
  scrollTo({top:0,behavior:"smooth"});
  if(!posted){ posted = true; bumpCounter(); } else { paintTaken(); }

  $("back").onclick = ()=>{ onResults=false; $("results").classList.add("hide");
    $("quiz").classList.remove("hide"); $("prog").classList.remove("hide"); i=0; render(); };
  $("again").onclick = ()=>{ onResults=false; ans.fill(null); wt.fill(1); i=0;
    $("results").classList.add("hide"); $("quiz").classList.remove("hide");
    $("prog").classList.remove("hide"); render(); };
}

/* ---------------- language ---------------- */
function setLang(l){
  lang = l; paintChrome();
  if(onResults) finish(); else render();
}

document.addEventListener("keydown", e=>{
  if(onResults) return;
  if(e.key>="1" && e.key<="5"){
    const b=$("quiz").querySelector(`.opt[data-v="${+e.key-3}"]`);
    if(b){ b.click(); e.preventDefault(); }
  }
  if(e.key==="v"||e.key==="V"){ wt[i]= wt[i]===1?2:1; render(); }
  if(e.key==="ArrowRight" && i<Q.length-1){ i++; render(); }
  if(e.key==="ArrowLeft"  && i>0){ i--; render(); }
});

paintChrome();
render();
</script>
